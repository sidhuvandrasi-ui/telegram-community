<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#020604;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:18px;
overflow-x:hidden;
}

/* BACKGROUND GLOW */

body:before{
content:"";
position:fixed;
width:300px;
height:300px;
background:#00ff66;
filter:blur(150px);
opacity:.08;
top:-100px;
left:-100px;
}

body:after{
content:"";
position:fixed;
width:300px;
height:300px;
background:#00c853;
filter:blur(150px);
opacity:.07;
bottom:-120px;
right:-100px;
}

/* MAIN CARD */

.card{
width:100%;
max-width:430px;
background:linear-gradient(
145deg,
rgba(12,30,20,.98),
rgba(3,12,8,.98)
);

border:1px solid rgba(91,130,42,.65);
border-radius:28px;

padding:38px 24px 30px;

text-align:center;

position:relative;

box-shadow:
0 20px 70px rgba(0,0,0,.75),
0 0 35px rgba(65,140,45,.10);

overflow:hidden;

animation:cardGlow 4s ease-in-out infinite;
}

@keyframes cardGlow{

0%,100%{
box-shadow:
0 20px 70px rgba(0,0,0,.75),
0 0 30px rgba(65,140,45,.10);
}

50%{
box-shadow:
0 20px 70px rgba(0,0,0,.75),
0 0 45px rgba(85,170,55,.22);
}

}

/* TOP LINE */

.top-line{
width:70px;
height:4px;
background:#d8b52d;
border-radius:10px;
margin:0 auto 25px;
box-shadow:0 0 12px rgba(216,181,45,.35);
}

/* LOGO */

.logo{
width:125px;
height:125px;
margin:auto;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
#164a27 0%,
#082414 60%,
#020b06 100%
);

border:4px solid #718d31;

box-shadow:
0 0 0 5px rgba(113,141,49,.08),
0 0 30px rgba(110,160,50,.25);

animation:logoPulse 3s ease-in-out infinite;
}

.logo-text{
font-family:Georgia,serif;
font-size:38px;
font-weight:bold;
letter-spacing:2px;
color:#e4be35;

text-shadow:
0 2px 10px rgba(0,0,0,.6);
}

@keyframes logoPulse{

0%,100%{
box-shadow:
0 0 0 5px rgba(113,141,49,.08),
0 0 25px rgba(110,160,50,.20);
}

50%{
box-shadow:
0 0 0 7px rgba(140,170,55,.10),
0 0 42px rgba(140,180,55,.42);
}

}

/* TITLE */

.title{
margin-top:30px;

font-family:Georgia,serif;

font-size:31px;
line-height:1.15;

font-weight:bold;

letter-spacing:1.5px;

color:#e4bd35;

text-shadow:
0 0 8px rgba(228,189,53,.15);

animation:titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow{

0%,100%{
text-shadow:
0 0 6px rgba(228,189,53,.15);
}

50%{
text-shadow:
0 0 12px rgba(228,189,53,.45),
0 0 25px rgba(228,189,53,.18);
}

}

/* DIVIDER */

.divider{
width:95px;
height:3px;

background:#b59a2c;

border-radius:10px;

margin:20px auto;

box-shadow:
0 0 12px rgba(181,154,44,.25);
}

/* SUBTITLE */

.subtitle{
font-size:18px;
font-weight:bold;

margin-top:5px;
}

.description{
margin-top:12px;

color:#9aaa9f;

font-size:14px;

line-height:1.5;
}

/* FEATURE BOX */

.features{
margin-top:25px;

display:grid;
grid-template-columns:repeat(3,1fr);

gap:8px;
}

.feature{
padding:13px 5px;

background:rgba(12,35,22,.75);

border:1px solid rgba(95,130,45,.25);

border-radius:12px;

font-size:11px;

color:#c4cec7;
}

.feature strong{
display:block;

font-size:17px;

margin-bottom:5px;

color:#e3bd36;
}

/* TELEGRAM BUTTON */

.join{
display:flex;

align-items:center;
justify-content:center;

width:100%;

margin-top:30px;

padding:18px 12px;

border-radius:14px;

text-decoration:none;

font-family:Georgia,serif;

font-size:18px;

font-weight:bold;

letter-spacing:1.5px;

color:white;

background:
linear-gradient(
135deg,
#08743a,
#07552d
);

border:1px solid #21864b;

box-shadow:
0 8px 25px rgba(0,130,60,.25);

transition:.25s;

animation:buttonGlow 2.5s ease-in-out infinite;
}

.join:hover{
transform:translateY(-3px);

box-shadow:
0 12px 35px rgba(0,160,70,.40);
}

@keyframes buttonGlow{

0%,100%{
box-shadow:
0 8px 25px rgba(0,130,60,.22);
}

50%{
box-shadow:
0 8px 32px rgba(0,170,75,.42),
0 0 18px rgba(0,170,75,.18);
}

}

.telegram-icon{
width:27px;
height:27px;

border-radius:50%;

background:white;

color:#08733a;

display:flex;

align-items:center;
justify-content:center;

font-size:14px;

margin-right:10px;
}

.arrow{
margin-left:10px;

font-size:20px;

color:#e4bd35;
}

/* NOTE */

.note{
margin-top:15px;

font-size:11px;

color:#77877d;
}

/* FOOTER */

.footer{
margin-top:28px;

padding-top:18px;

border-top:1px solid rgba(180,160,50,.12);

font-size:9px;

letter-spacing:1px;

color:#64746b;
}

/* MOBILE */

@media(max-width:380px){

padding:32px 18px 25px;
}

width:110px;
height:110px;

.logo-text{
font-size:33px;
}

.title{
font-size:27px;
}

.subtitle{
font-size:16px;
}

.join{
font-size:16px;
}

}
